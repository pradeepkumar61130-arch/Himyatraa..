<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIMyatraa Tours & Travels</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:linear-gradient(to right,#1e3c72,#2a5298);
color:#333;
}

header{
text-align:center;
padding:60px 20px;
color:white;
}

header h1{font-size:42px;}
header p{margin-top:10px;font-size:18px;}

.search-box{
text-align:center;
margin:20px 0;
}

.search-box input{
padding:12px;
width:80%;
max-width:400px;
border-radius:30px;
border:none;
outline:none;
}

.destinations{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.3s;
}

.card:hover{transform:scale(1.03);}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.card-content h3{
margin-bottom:5px;
color:#1e3c72;
}

.card-content p{
font-size:14px;
color:#555;
}

.buttons{
text-align:center;
margin:40px 0;
}

.btn{
display:inline-flex;
align-items:center;
gap:8px;
padding:12px 22px;
margin:10px;
border-radius:30px;
color:white;
text-decoration:none;
font-weight:600;
font-size:15px;
}

.call{background:#007bff;}
.whatsapp{background:#25D366;}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}
</style>
</head>

<body>

<header>
<h1>HIMyatraa Tours & Travels</h1>
<p>Explore Uttarakhand with Comfort & Trust</p>
</header>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search Destination..." onkeyup="searchFunction()">
</div>

<div class="destinations" id="destinationList"></div>

<div class="buttons">
<a href="tel:8679490106" class="btn call">
<i class="fa-solid fa-phone"></i> Call Now
</a>

<a href="https://wa.me/918679490106" class="btn whatsapp" target="_blank">
<i class="fa-brands fa-whatsapp"></i> WhatsApp Uttarakhand
</a>

<a href="https://wa.me/918679490106" class="btn whatsapp" target="_blank">
<i class="fa-brands fa-whatsapp"></i> WhatsApp All India
</a>
</div>

<footer>
© 2026 HIMyatraa Tours & Travels | All Rights Reserved
</footer>

<script>
const destinations = [
{name:"Rishikesh",img:"https://images.unsplash.com/photo-1593693397690-362cb9666fc2",desc:"Yoga Capital of the World. Famous for rafting and spiritual vibes."},
{name:"Haridwar",img:"https://images.unsplash.com/photo-1561361513-2d000a50f0dc",desc:"Sacred city of Ganga Aarti and pilgrimage."},
{name:"Kedarnath",img:"https://images.unsplash.com/photo-1626621341517-bbf3d9990b5f",desc:"Sacred Jyotirlinga temple in Himalayas."},
{name:"Badrinath",img:"https://images.unsplash.com/photo-1609766856921-ef4a2c5c1d45",desc:"Char Dham site dedicated to Lord Vishnu."},
{name:"Mussoorie",img:"https://images.unsplash.com/photo-1586183189334-6c1b59ddcc7a",desc:"Queen of Hills with beautiful views."},
{name:"Nainital",img:"https://images.unsplash.com/photo-1589308078056-f9c75c3a5f2b",desc:"Famous lake city of Uttarakhand."},
{name:"Auli",img:"https://images.unsplash.com/photo-1549880338-65ddcdfd017b",desc:"Popular skiing destination with snow peaks."},
{name:"Jim Corbett",img:"https://images.unsplash.com/photo-1508672019048-805c876b67e2",desc:"India's oldest national park, famous for tigers."},
{name:"Valley of Flowers",img:"https://images.unsplash.com/photo-1501785888041-af3ef285b470",desc:"UNESCO site filled with colorful flowers."},
{name:"Chopta",img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",desc:"Mini Switzerland of India."},
{name:"Tungnath",img:"https://images.unsplash.com/photo-1519681393784-d120267933ba",desc:"Highest Shiva temple with stunning views."},
{name:"Almora",img:"https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1",desc:"Peaceful hill town with heritage."},
{name:"Ranikhet",img:"https://images.unsplash.com/photo-1470770841072-f978cf4d019e",desc:"Beautiful cantonment hill station."},
{name:"Kausani",img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e",desc:"Panoramic Himalayan view point."},
{name:"Munsiyari",img:"https://images.unsplash.com/photo-1472214103451-9374bd1c798e",desc:"Gateway to glaciers and adventure."},
{name:"Tehri",img:"https://images.unsplash.com/photo-1506744038136-46273834b3fb",desc:"Famous for Tehri Dam and water sports."}
];

const container=document.getElementById("destinationList");

destinations.forEach(place=>{
container.innerHTML+=`
<div class="card">
<img src="${place.img}" alt="${place.name}">
<div class="card-content">
<h3>${place.name}</h3>
<p>${place.desc}</p>
</div>
</div>
`;
});

function searchFunction(){
let input=document.getElementById("searchInput").value.toLowerCase();
let cards=document.getElementsByClassName("card");
for(let i=0;i<cards.length;i++){
let title=cards[i].getElementsByTagName("h3")[0].innerText.toLowerCase();
cards[i].style.display=title.includes(input)?"block":"none";
}
}
</script>

</body>
</html>
