<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uttarakhand Tours</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c92d2);
background-size:400% 400%;
animation:bg 12s ease infinite;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

header{
text-align:center;
padding:60px 20px;
}

header h1{
font-size:42px;
margin-bottom:10px;
}

header p{
font-size:18px;
opacity:.9;
}

.section{
padding:40px 5%;
}

.section h2{
text-align:center;
margin-bottom:30px;
font-size:28px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(8px);
border-radius:15px;
overflow:hidden;
transition:.3s;
box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.card-content h3{
margin-bottom:8px;
font-size:20px;
}

.card-content p{
font-size:14px;
opacity:.85;
}

.contact{
text-align:center;
padding:40px 20px;
}

.contact input,.contact select{
padding:10px;
margin:10px;
width:250px;
border-radius:8px;
border:none;
}

.contact button{
padding:10px 20px;
background:#25D366;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.whatsapp-float{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
width:55px;
height:55px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:26px;
box-shadow:0 5px 15px rgba(0,0,0,.4);
}

footer{
text-align:center;
padding:20px;
opacity:.7;
}

</style>
</head>

<body>

<header>
<h1>Explore Beautiful Uttarakhand</h1>
<p>Spiritual • Adventure • Nature • Family Tours</p>
</header>

<section class="section">
<h2>Uttarakhand Destinations</h2>
<div class="grid" id="ukGrid"></div>
</section>

<section class="section">
<h2>All India Tours</h2>
<div class="grid" id="indiaGrid"></div>
</section>

<section class="contact">
<h2>Book Your Trip</h2>
<input type="text" id="name" placeholder="Your Name"><br>
<input type="text" id="phone" placeholder="Your Phone"><br>
<select id="destination">
<option>Kedarnath</option>
<option>Badrinath</option>
<option>Nainital</option>
<option>Goa</option>
<option>Manali</option>
</select><br>
<button onclick="sendWhatsApp()">Send on WhatsApp</button>
</section>

<a href="https://wa.me/918679490106" class="whatsapp-float" target="_blank">
<i class="fab fa-whatsapp"></i>
</a>

<footer>
© 2026 Uttarakhand Tours | All Rights Reserved
</footer>

<script>

const defaultImage="https://picsum.photos/400/300?random=";

const ukPlaces=[
"Kedarnath","Badrinath","Gangotri","Yamunotri","Haridwar","Rishikesh","Nainital","Mussoorie",
"Auli","Chopta","Dehradun","Almora","Bageshwar","Binsar","Pithoragarh","Munsiyari",
"Ranikhet","Lansdowne","Tehri","Dhanaulti","Harsil","Kausani","Pangot","Valley of Flowers",
"Jim Corbett","Guptkashi","Tungnath","Hemkund Sahib","Joshimath","Devprayag",
"Rudraprayag","Karnaprayag","Bhimtal","Sattal","Naukuchiatal","Chakrata",
"Kanatal","Pauri","Gwaldam","Kotdwar"
];

const indiaPlaces=["Goa","Manali","Shimla","Jaipur","Kashmir","Ladakh","Kerala","Darjeeling","Andaman","Udaipur","Ooty","Kanyakumari"];

function createCard(place,index){
return `
<div class="card">
<img src="${defaultImage+index}">
<div class="card-content">
<h3>${place}</h3>
<p>Explore the beautiful landscapes of ${place}.<br>
Perfect for family trips, honeymoon & adventure tours.</p>
</div>
</div>
`;
}

ukPlaces.forEach((p,i)=>{
document.getElementById("ukGrid").innerHTML+=createCard(p,i);
});

indiaPlaces.forEach((p,i)=>{
document.getElementById("indiaGrid").innerHTML+=createCard(p,i+100);
});

function sendWhatsApp(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let dest=document.getElementById("destination").value;
let msg=`Hello, I am ${name}. My number is ${phone}. I want details for ${dest}.`;
window.open(`https://wa.me/918679490106?text=${encodeURIComponent(msg)}`,'_blank');
}

</script>

</body>
</html>
