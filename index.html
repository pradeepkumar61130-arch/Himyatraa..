<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIMyatraa Tours & Travels</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#f5f7fa;}

header{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
padding:60px 20px;
text-align:center;
}

header h1{font-size:40px;}
header p{margin-top:10px;font-size:18px;}

.search-box{
text-align:center;
margin:30px 0;
}

.search-box input{
padding:12px;
width:80%;
max-width:400px;
border-radius:30px;
border:1px solid #ccc;
outline:none;
}

.destinations{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{transform:translateY(-5px);}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-content{padding:15px;}

.card-content h3{margin-bottom:5px;}

.card-content p{
font-size:14px;
color:#555;
}

.buttons{
text-align:center;
margin:40px 0;
}

.btn{
display:inline-flex;
align-items:center;
gap:8px;
padding:12px 22px;
margin:10px;
border-radius:30px;
color:white;
text-decoration:none;
font-weight:600;
font-size:15px;
}

.call{background:#007bff;}
.whatsapp{background:#25D366;}

footer{
background:#111;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}
</style>
</head>

<body>

<header>
<h1>HIMyatraa Tours & Travels</h1>
<p>Explore Uttarakhand with Comfort & Trust</p>
</header>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search Destination..." onkeyup="searchFunction()">
</div>

<div class="destinations" id="destinationList"></div>

<script>
const destinations = [
{name:"Rishikesh",img:"https://source.unsplash.com/600x400/?rishikesh",desc:"Yoga Capital of the World. Famous for rafting and spiritual vibes."},
{name:"Haridwar",img:"https://source.unsplash.com/600x400/?haridwar",desc:"Sacred city of Ganga Aarti. One of India's holiest places."},
{name:"Kedarnath",img:"https://source.unsplash.com/600x400/?kedarnath-temple",desc:"Sacred Jyotirlinga temple surrounded by Himalayas."},
{name:"Badrinath",img:"https://source.unsplash.com/600x400/?badrinath-temple",desc:"Important Char Dham site dedicated to Lord Vishnu."},
{name:"Mussoorie",img:"https://source.unsplash.com/600x400/?mussoorie-hill-station",desc:"Queen of Hills with beautiful scenic views."},
{name:"Nainital",img:"https://source.unsplash.com/600x400/?nainital-lake",desc:"Lake city famous for Naini Lake."},
{name:"Auli",img:"https://source.unsplash.com/600x400/?auli-snow",desc:"Popular skiing destination with snow mountains."},
{name:"Jim Corbett",img:"https://source.unsplash.com/600x400/?jim-corbett-national-park",desc:"India's oldest national park known for tigers."},
{name:"Valley of Flowers",img:"https://source.unsplash.com/600x400/?valley-of-flowers-india",desc:"UNESCO site filled with colorful flowers."},
{name:"Chopta",img:"https://source.unsplash.com/600x400/?chopta-uttarakhand",desc:"Mini Switzerland of India and trekking hub."},
{name:"Tungnath",img:"https://source.unsplash.com/600x400/?tungnath-temple",desc:"Highest Shiva temple with stunning views."},
{name:"Almora",img:"https://source.unsplash.com/600x400/?almora-hills",desc:"Peaceful hill town with cultural heritage."},
{name:"Ranikhet",img:"https://source.unsplash.com/600x400/?ranikhet-hill",desc:"Beautiful cantonment town in hills."},
{name:"Kausani",img:"https://source.unsplash.com/600x400/?kausani-himalaya",desc:"Panoramic Himalayan view point."},
{name:"Munsiyari",img:"https://source.unsplash.com/600x400/?munsiyari-himalaya",desc:"Gateway to glaciers and adventure."},
{name:"Tehri",img:"https://source.unsplash.com/600x400/?tehri-dam",desc:"Famous for Tehri Dam and water sports."}
];

const container = document.getElementById("destinationList");

destinations.forEach(place=>{
container.innerHTML+=`
<div class="card">
<img src="${place.img}" alt="${place.name}">
<div class="card-content">
<h3>${place.name}</h3>
<p>${place.desc}</p>
</div>
</div>
`;
});

function searchFunction(){
let input=document.getElementById("searchInput").value.toLowerCase();
let cards=document.getElementsByClassName("card");
for(let i=0;i<cards.length;i++){
let title=cards[i].getElementsByTagName("h3")[0].innerText.toLowerCase();
cards[i].style.display=title.includes(input)?"block":"none";
}
}
</script>

<div class="buttons">
<a href="tel:8679490106" class="btn call">
<i class="fa-solid fa-phone"></i> Call Now
</a>

<a href="https://wa.me/918679490106" class="btn whatsapp" target="_blank">
<i class="fa-brands fa-whatsapp"></i> WhatsApp Uttarakhand
</a>

<a href="https://wa.me/918679490106" class="btn whatsapp" target="_blank">
<i class="fa-brands fa-whatsapp"></i> WhatsApp All India
</a>
</div>

<footer>
© 2026 HIMyatraa Tours & Travels | All Rights Reserved
</footer>

</body>
</html>
