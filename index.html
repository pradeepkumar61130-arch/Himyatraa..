<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIMyatraa Tours & Travels</title>

<meta name="description" content="HIMyatraa Tours & Travels - 40+ Uttarakhand & All India Tour Packages. Direct WhatsApp Booking Available.">
<meta name="keywords" content="Uttarakhand tour, Kedarnath, Badrinath, Chardham, India tour packages">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
scroll-behavior:smooth;
}

/* NAV */
nav{
background:#00000090;
backdrop-filter:blur(10px);
padding:15px;
position:fixed;
width:100%;
z-index:999;
text-align:center;
}
nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

/* HERO */
.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1600&q=80') center/cover;
}
.hero h1{font-size:3rem;}
.hero p{margin:20px 0;}
.btn{
padding:15px 30px;
background:#ff7b00;
border-radius:30px;
color:white;
text-decoration:none;
font-weight:bold;
}

/* SECTION */
section{padding:100px 20px;text-align:center;}
h2{margin-bottom:40px;font-size:2rem;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(15px);
border-radius:15px;
overflow:hidden;
transition:0.4s;
box-shadow:0 5px 20px rgba(0,0,0,0.4);
}
.card:hover{transform:scale(1.05);}
.card img{width:100%;height:200px;object-fit:cover;}
.card-content{padding:15px;}

/* BOOKING */
form{
max-width:500px;
margin:auto;
display:flex;
flex-direction:column;
gap:15px;
}
input,select{
padding:12px;border:none;border-radius:8px;
}
button{
padding:12px;
background:#ff7b00;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
cursor:pointer;
}

/* FLOATING */
.floating a{
position:fixed;
right:20px;
padding:18px;
border-radius:50%;
font-size:22px;
color:white;
text-decoration:none;
box-shadow:0 5px 15px rgba(0,0,0,0.4);
}
.whatsapp{bottom:20px;background:#25D366;}
.call{bottom:90px;background:#e84118;}

footer{
background:#00000090;
padding:20px;
text-align:center;
}
</style>
</head>

<body>

<nav>
<a href="#uttarakhand">Uttarakhand</a>
<a href="#india">All India</a>
<a href="#booking">Booking</a>
</nav>

<div class="hero">
<div>
<h1>HIMyatraa Tours & Travels</h1>
<p>40+ Uttarakhand & All India Premium Tour Packages</p>
<a href="#booking" class="btn">Book Now</a>
</div>
</div>

<!-- UTTARAKHAND 40+ -->
<section id="uttarakhand">
<h2>Uttarakhand Destinations (40+)</h2>
<div class="grid">

<!-- AUTO GENERATED 40 DESTINATIONS -->
<script>
const destinations = [
"Kedarnath","Badrinath","Gangotri","Yamunotri","Haridwar","Rishikesh","Nainital","Mussoorie",
"Auli","Chopta","Dehradun","Almora","Bageshwar","Binsar","Pithoragarh","Munsiyari",
"Ranikhet","Lansdowne","Tehri","Dhanaulti","Harsil","Kausani","Pangot","Valley of Flowers",
"Jim Corbett","Guptkashi","Tungnath","Hemkund Sahib","Joshimath","Devprayag",
"Rudraprayag","Karnaprayag","Bhimtal","Sattal","Naukuchiatal","Chakrata",
"Kanatal","Pauri","Gwaldam","Kotdwar"
];

document.write(destinations.map(d=>`
<div class="card">
<img src="https://source.unsplash.com/400x300/?${d},mountain">
<div class="card-content">
<h3>${d}</h3>
<p>Premium & Budget packages available.</p>
</div>
</div>
`).join(""));
</script>

</div>
</section>

<!-- ALL INDIA -->
<section id="india">
<h2>All India Tour Packages</h2>
<div class="grid">

<script>
const india = [
"Goa","Manali","Shimla","Jaipur","Kashmir","Ladakh","Kerala","Darjeeling",
"Andaman","Udaipur","Ooty","Kanyakumari"
];

document.write(india.map(d=>`
<div class="card">
<img src="https://source.unsplash.com/400x300/?${d},india">
<div class="card-content">
<h3>${d}</h3>
<p>Luxury & Family Tour Packages.</p>
</div>
</div>
`).join(""));
</script>

</div>
</section>

<!-- BOOKING -->
<section id="booking">
<h2>Book on WhatsApp</h2>
<form onsubmit="sendWhatsApp(event)">
<input type="text" id="name" placeholder="Your Name" required>
<input type="tel" id="phone" placeholder="Mobile Number" required>
<select id="destination" required>
<option value="">Select Destination</option>
<option>Kedarnath</option>
<option>Nainital</option>
<option>Goa</option>
<option>Manali</option>
</select>
<button type="submit">Send on WhatsApp</button>
</form>
</section>

<div class="floating">
<a href="tel:+918679490106" class="call"><i class="fas fa-phone"></i></a>
<a href="https://wa.me/918679490106" class="whatsapp" target="_blank"><i class="fab fa-whatsapp"></i></a>
</div>

<footer>
© 2026 HIMyatraa Tours & Travels | Designed by Pradeep
</footer>

<script>
function sendWhatsApp(e){
e.preventDefault();
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let dest=document.getElementById("destination").value;
let msg=`Hello, I am ${name}. My number is ${phone}. I want package details for ${dest}.`;
window.open(`https://wa.me/918679490106?text=${encodeURIComponent(msg)}`,'_blank');
}
</script>

</body>
</html>
