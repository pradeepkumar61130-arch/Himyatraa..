<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIMyatraa Tours & Travels</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#fff}

/* NAV */
nav{background:#000000cc;padding:15px;position:fixed;width:100%;z-index:999;text-align:center}
nav a{color:#fff;margin:0 15px;text-decoration:none;font-weight:bold}

/* HERO MOUNTAIN BG */
.hero{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}
.hero::before{
content:"";
position:absolute;width:100%;height:100%;
background-image:url('https://images.unsplash.com/photo-1509644851169-2acc08aa25b5');
background-size:cover;background-position:center;
opacity:0.6;z-index:-1}

.btn{padding:10px 25px;background:#ff7b00;border-radius:25px;color:#fff;text-decoration:none}

/* SECTIONS */
section{padding:100px 20px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#ffffff15;border-radius:15px;overflow:hidden;transition:.3s}
.card:hover{transform:translateY(-6px)}
.card img{width:100%;height:200px;object-fit:cover}
.card-content{padding:15px}

/* BOOKING */
form{max-width:500px;margin:auto;display:flex;flex-direction:column;gap:10px}
input,select{padding:10px;border-radius:8px;border:none}
button{padding:10px;background:#ff7b00;border:none;border-radius:8px;color:#fff;font-weight:bold}

/* FLOAT */
.floating a{position:fixed;right:20px;padding:15px;border-radius:50%;font-size:20px;color:#fff}
.whatsapp{bottom:20px;background:#25D366}
.call{bottom:80px;background:#e84118}

footer{text-align:center;padding:20px;background:#000000cc}
</style>
</head>

<body>

<nav>
<a href="#uttarakhand">Uttarakhand</a>
<a href="#india">All India</a>
<a href="#booking">Booking</a>
</nav>

<div class="hero">
<div>
<h1>HIMyatraa Tours & Travels</h1>
<p>Explore Spiritual & Adventure Tours</p>
<a href="#booking" class="btn">Book Now</a>
</div>
</div>

<section id="uttarakhand">
<h2>Uttarakhand Destinations</h2>
<div class="grid" id="ukGrid"></div>
</section>

<section id="india">
<h2>All India Packages</h2>
<div class="grid" id="indiaGrid"></div>
</section>

<section id="booking">
<h2>Book Your Trip</h2>
<form onsubmit="sendWhatsApp(event)">
<input type="text" id="name" placeholder="Your Name" required>
<input type="tel" id="phone" placeholder="Mobile Number" required>
<select id="destination"></select>
<button type="submit">Send on WhatsApp</button>
</form>
</section>

<div class="floating">
<a href="tel:+918679490106" class="call"><i class="fas fa-phone"></i></a>
<a href="https://wa.me/918679490106" target="_blank" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
</div>

<footer>© 2026 HIMyatraa Tours & Travels</footer>

<script>

/* ===== IMAGES ===== */
const placesImages={

/* Uttarakhand */
"Kedarnath":"https://images.unsplash.com/photo-1605649487212-47bdab064df6",
"Badrinath":"https://images.unsplash.com/photo-1626621341517-bbf3d9990d8f",
"Rishikesh":"https://images.unsplash.com/photo-1595815771614-ade5019d5f3f",
"Haridwar":"https://images.unsplash.com/photo-1609137144813-7d9921338f24",
"Nainital":"https://images.unsplash.com/photo-1594103447925-2d4c38a6d5a1",
"Mussoorie":"https://images.unsplash.com/photo-1587474260584-136574528ed5",
"Auli":"https://images.unsplash.com/photo-1605640840605-14ac1855827b",
"Chopta":"https://images.unsplash.com/photo-1630155346909-5f00e1f4c3df",
"Tungnath":"https://images.unsplash.com/photo-1628157588553-5eeea00af15c",
"Valley of Flowers":"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
"Jim Corbett":"https://images.unsplash.com/photo-1501706362039-c6e80948bbf8",
"Hemkund Sahib":"https://images.unsplash.com/photo-1501785888041-af3ef285b470",

/* India */
"Manali":"https://images.unsplash.com/photo-1597074866923-dc0589150358",
"Shimla":"https://images.unsplash.com/photo-1593693411515-c20261bcad6e",
"Dharamshala":"https://images.unsplash.com/photo-1526772662000-3f88f10405ff",
"Goa":"https://images.unsplash.com/photo-1507525428034-b723cf961d3e",
"Jaipur":"https://images.unsplash.com/photo-1599661046827-dacff0c0f09a",
"Udaipur":"https://images.unsplash.com/photo-1564507592333-c60657eea523",
"Jaisalmer":"https://images.unsplash.com/photo-1587474260584-136574528ed5",
"Amritsar":"https://images.unsplash.com/photo-1609947017136-9daf32a5eb16",
"Kashmir":"https://images.unsplash.com/photo-1595815771614-ade5019d5f3f",
"Ladakh":"https://images.unsplash.com/photo-1593181629936-11c609b8db9b",
"Kerala":"https://images.unsplash.com/photo-1593693411515-c20261bcad6e",
"Andaman":"https://images.unsplash.com/photo-1500375592092-40eb2168fd21",
"Ooty":"https://images.unsplash.com/photo-1501785888041-af3ef285b470",
"Kodaikanal":"https://images.unsplash.com/photo-1526778548025-fa2f459cd5ce",
"Darjeeling":"https://images.unsplash.com/photo-1526481280691-781ae5ff6f8c",
"Sikkim":"https://images.unsplash.com/photo-1518684079-3c830dcef090"
};

/* LISTS */
const ukPlaces=Object.keys(placesImages).slice(0,12);
const indiaPlaces=Object.keys(placesImages).slice(12);

/* CARD */
function createCard(place){
return `<div class="card">
<img src="${placesImages[place]}" alt="${place}">
<div class="card-content"><h3>${place}</h3></div>
</div>`;
}

/* LOAD */
ukPlaces.forEach(p=>ukGrid.innerHTML+=createCard(p));
indiaPlaces.forEach(p=>indiaGrid.innerHTML+=createCard(p));

/* DROPDOWN */
[...ukPlaces,...indiaPlaces].forEach(p=>{
destination.innerHTML+=`<option>${p}</option>`;
});

/* WHATSAPP */
function sendWhatsApp(e){
e.preventDefault();
let msg=`Hello, I am ${name.value}. My number is ${phone.value}. I want details for ${destination.value}.`;
window.open(`https://wa.me/918679490106?text=${encodeURIComponent(msg)}`);
}

</script>
</body>
</html>
